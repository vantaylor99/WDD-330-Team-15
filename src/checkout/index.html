<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Checkout</title>
  <script src="../js/modules/cartCountBadge.mjs" type="module"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
  <script src="../js/modules/ShoppingCart.mjs" type="module"></script>

  <title>Sleep Outside | Checkout</title>
  <script src="../js/modules/cartCountBadge.mjs" type="module"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="/js/checkout.js" type="module"></script>



</head>

<body>
  <header class="divider" id="main-divider">
  </header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>
      <form action="/submit" method="post">
        <fieldset>
          <legend>Contact & Shipping</legend>

          <label for="fName">First Name</label>
          <input type="text" id="fName" name="fName" required autocomplete="given-name">

          <label for="fName">First Name</label>
          <input type="text" id="fName" name="fName" required autocomplete="family-name">

          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email">

          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" required autocomplete="tel">
        </fieldset>

        <fieldset>
          <legend>Shipping Information</legend>
          <label for="street-address">Street Address</label>
          <input type="text" id="address" name="address" required autocomplete="street-address">

          <label for="city">City</label>
          <input type="text" id="city" name="city" required autocomplete="address-level2">

          <label for="state">Address</label>
          <input type="text" id="state" name="state" required autocomplete="address-level1">

          <label for="zip-code">Zip</label>
          <input type="text" id="zip-code" name="zip-code" required autocomplete="postal-code">
        </fieldset>

        <fieldset>
          <legend>Payment Information</legend>
          <label for="credit-card">Credit Card Number</label>
          <input type="text" id="credit-card" name="credit-card" required autocomplete="cc-number">

          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" required autocomplete="cc-exp">

          <label for="security-code">Security Code</label>
          <input type="text" id="security-code" name="security-code" required autocomplete="cc-csc">

        </fieldset>
        <button type="submit">Purchase</button>
      </form>

      <aside id="order-summary">
        <h2>Order Summary</h2>
        <p>Subtotal: <span id="subtotal"></span></p>
        <p>Tax: <span id="tax"></span></p>
        <p>Shipping: <span id="shipping"></span></p>
        <p><strong>Total: </strong><span id="total"></span></p>
      </aside>
    </section>
  </main>
  <footer id="lower-divider"></footer>
</body>

</html>
