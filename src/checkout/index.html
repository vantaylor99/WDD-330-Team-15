<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Checkout</title>
  <script src="../js/modules/cartCountBadge.mjs" type="module"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/checkout.js" type="module"></script>
  <script src="../js/modules/ShoppingCart.mjs" type="module"></script>

  <title>Sleep Outside | Checkout</title>
  <script src="../js/modules/cartCountBadge.mjs" type="module"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="/js/checkout.js" type="module"></script>



</head>

<body>
  <header class="divider" id="main-divider">
  </header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>
      <form action="/submit" method="post" id="checkout-form">
        <fieldset>
          <legend>Contact & Shipping</legend>

          <div class="two-col">
            <div class="form-row">
              <label for="fname">First Name</label>
              <input type="text" id="fname" name="fname" required autocomplete="given-name">
            </div>

            <div class="form-row">
              <label for="lname">Last Name</label>
              <input type="text" id="lname" name="lname" required autocomplete="family-name">
            </div>
          </div>

          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>

          <div class="form-row">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" required autocomplete="tel">
          </div>
        </fieldset>

        <fieldset>
          <legend>Shipping Information</legend>

          <div class="form-row">
            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required autocomplete="shipping street-address">
          </div>

          <div class="two-col">
            <div class="form-row">
              <label for="city">City</label>
              <input type="text" id="city" name="city" required autocomplete="shipping address-level2">
            </div>

            <div class="form-row">
              <label for="state">State</label>
              <input type="text" id="state" name="state" required autocomplete="shipping address-level1">
            </div>
          </div>

          <div class="form-row">
            <label for="zip">Zip</label>
            <input type="text" id="zip" name="zip" required autocomplete="shipping postal-code">
          </div>
        </fieldset>

        <fieldset>
          <legend>Payment Information</legend>

          <div class="form-row">
            <label for="cardNumber">Credit Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" required autocomplete="cc-number" inputmode="numeric"
              value="1234123412341234">
          </div>

          <div class="two-col">
            <div class="form-row">
              <label for="expiration">Expiration Date</label>
              <input type="text" id="expiration" name="expiration" required autocomplete="cc-exp" inputmode="numeric"
                value="10/25">
            </div>

            <div class="form-row">
              <label for="code">Security Code</label>
              <input type="text" id="code" name="code" required autocomplete="cc-csc" inputmode="numeric" value="123">
            </div>
          </div>
        </fieldset>

        <button type="submit" id="checkout-button">Purchase</button>
      </form>


      <aside id="order-summary">
        <h2>Order Summary</h2>
        <p>Subtotal: <span id="subtotal"></span></p>
        <p>Tax: <span id="tax"></span></p>
        <p>Shipping: <span id="shipping"></span></p>
        <p><strong>Total: </strong><span id="total"></span></p>
      </aside>
    </section>
  </main>
  <footer id="lower-divider"></footer>
</body>

</html>
